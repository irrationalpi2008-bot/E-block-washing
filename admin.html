<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E Block Laundry :: Admin</title>
<style>
  :root { --bg:#080b0e; --panel:#10161a; --line:#26343a; --text:#c8d3d5; --muted:#708087; --green:#75f09b; --yellow:#f5d76e; --red:#ff7777; --cyan:#72d9e8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 "IBM Plex Mono", "Courier New", monospace; }
  .shell { max-width:1600px; margin:0 auto; padding:24px; }
  .top { border:1px solid var(--green); padding:18px 20px; box-shadow:0 0 18px rgba(117,240,155,.12); }
  h1 { margin:0; color:var(--green); font-size:20px; letter-spacing:.08em; }
  .prompt { color:var(--muted); margin-top:6px; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin:18px 0; align-items:center; }
  input, button { border:1px solid var(--line); background:#0c1114; color:var(--text); font:inherit; padding:9px 11px; }
  input { min-width:280px; }
  button { cursor:pointer; color:var(--green); border-color:var(--green); }
  button:hover { background:#14231b; }
  button.danger { color:var(--red); border-color:var(--red); }
  button.small { padding:5px 7px; font-size:12px; }
  .add-form { display:grid; grid-template-columns:repeat(4, minmax(130px, 1fr)); gap:8px; margin:18px 0; }
  .add-form input, .add-form select { min-width:0; width:100%; }
  .add-form input[name="room"] { max-width:110px; }
  td input[data-field="room"] { width:90px; min-width:90px; }
  .add-form button { grid-column:span 1; }
  .row-actions { display:flex; gap:5px; flex-wrap:wrap; min-width:210px; }
  @media(max-width:900px) { .add-form { grid-template-columns:repeat(2, minmax(130px, 1fr)); } }
  .status { color:var(--muted); }
  .error { color:var(--red); white-space:pre-wrap; }
  .summary { border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:10px 0; margin-bottom:14px; color:var(--cyan); }
  .preview { border:1px solid var(--cyan); padding:16px; margin-bottom:14px; color:var(--text); }
  .preview-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; margin-bottom:16px; }
  .preview-title { color:var(--cyan); font-size:16px; font-weight:600; }
  .preview-subtitle { color:var(--muted); margin-top:4px; }
  .preview-stats { display:flex; gap:8px; flex-wrap:wrap; }
  .preview-stat { border:1px solid var(--line); padding:6px 9px; color:var(--green); background:#0c1114; }
  .preview-grid-wrap { overflow:auto; border:1px solid var(--line); }
  .preview-grid { border-collapse:collapse; min-width:1120px; width:100%; table-layout:fixed; }
  .preview-grid th, .preview-grid td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .preview-grid th { padding:9px 8px; background:#172126; color:var(--green); text-align:center; }
  .preview-grid th.preview-time-col { width:108px; text-align:left; }
  .preview-grid td { height:74px; padding:5px; vertical-align:top; background:#0c1114; }
  .preview-grid td.preview-time-col { color:var(--cyan); font-weight:600; white-space:nowrap; background:var(--panel); }
  .preview-grid td.preview-occupied { background:#101d18; }
  .preview-machine { display:flex; align-items:flex-start; gap:4px; margin:2px 0; font-size:11px; line-height:1.25; }
  .preview-person { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .priority-badge { margin-left:auto; color:var(--yellow); white-space:nowrap; }
  .preview-blank { display:block; height:100%; min-height:62px; }
  .table-wrap { overflow:auto; border:1px solid var(--line); max-height:72vh; }
  table { border-collapse:collapse; min-width:1500px; width:100%; }
  th, td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; white-space:nowrap; }
  th { position:sticky; top:0; background:#172126; color:var(--green); z-index:2; }
  tr:hover td { background:#111e22; }
  .yes { color:var(--green); } .no { color:var(--red); } .pending { color:var(--yellow); }
  .choices { white-space:normal; min-width:240px; max-width:360px; }
  .dim { color:var(--muted); }
  @media(max-width:700px) { .shell { padding:12px; } input { min-width:0; width:100%; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>E BLOCK LAUNDRY // ADMIN CONSOLE</h1>
    <div class="prompt">root@e-block:~$ roster --inspect --live</div>
  </header>
  <div class="controls">
    <input id="key" type="password" placeholder="admin key">
    <input id="filter" type="search" placeholder="filter room, name, status">
    <button id="load">[ LOAD ROSTER ]</button>
    <button id="preview">[ PREVIEW ALLOTMENT ]</button>
    <button id="exportPdf">[ EXPORT ALLOTMENT (PDF) ]</button>
    <button id="clear">[ CLEAR ]</button>
    <button id="clearPreferences" class="danger">[ CLEAR ALL PREFERENCES ]</button>
    <span id="status" class="status">awaiting admin key</span>
  </div>
  <form id="addForm" class="add-form">
    <input name="room" placeholder="room" required>
    <input name="name" placeholder="full name" required>
    <select name="payment_status"><option value="pending">pending</option><option value="paid">paid</option><option value="not paying">not paying</option></select>
    <input name="source_note" placeholder="notes">
    <button type="submit">[ ADD RESIDENT ]</button>
  </form>
  <div id="summary" class="summary">No roster loaded.</div>
  <div id="previewResult" class="preview" hidden></div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>ROOM</th><th>RESIDENT</th><th>PAYMENT</th>
        <th>ACCOUNT</th><th>PIN</th><th>LAST LOGIN</th><th class="choices">CHOSEN SLOTS</th>
        <th>ASSIGNMENT</th><th>PREFERENCES UPDATED</th><th>ACTIONS</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="10" class="dim">No data.</td></tr></tbody>
    </table>
  </div>
</div>
<script>
const state = { rows: [], importedFrom: "" };
const $ = id => document.getElementById(id);
function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function choices(priorities) {
  return Object.entries(priorities || {}).sort((a,b) => Number(a[1]) - Number(b[1]))
    .map(([slot, rank]) => `P${esc(rank)} ${esc(slot)}`).join('<br>') || '<span class="dim">none</span>';
}
function render() {
  const query = $('filter').value.trim().toLowerCase();
  const rows = state.rows.filter(row => JSON.stringify(row).toLowerCase().includes(query));
  const registered = state.rows.filter(row => row.account_registered).length;
  const selected = state.rows.filter(row => row.priorities && Object.keys(row.priorities).length > 0).length;
  $('summary').textContent = `records=${rows.length}/${state.rows.length} | registered=${registered} | selected slots=${selected} | source=${state.importedFrom || 'unknown'} | passwords=never displayed`;
  $('rows').innerHTML = rows.map(row => {
    const assignment = row.assignment ? `${row.assignment.slot_label} / P${row.assignment.priority_awarded || 'fallback'}` : 'not assigned';
    const payClass = row.payment_status === 'paid' ? 'yes' : 'pending';
    return `<tr data-id="${esc(row.resident_id)}" data-room="${esc(row.room)}" data-name="${esc(row.name)}" data-note="${esc(row.source_note || '')}" data-using="${row.using_machine ? '1' : '0'}">
      <td><input data-field="room" value="${esc(row.room)}"></td><td><input data-field="name" value="${esc(row.name)}"></td>
      <td class="${payClass}"><select data-field="payment_status"><option ${row.payment_status === 'pending' ? 'selected' : ''}>pending</option><option ${row.payment_status === 'paid' ? 'selected' : ''}>paid</option><option ${row.payment_status === 'not paying' ? 'selected' : ''}>not paying</option></select></td>
      <td class="${row.account_registered ? 'yes' : 'no'}">${row.account_registered ? 'REGISTERED' : 'NOT REGISTERED'}</td>
      <td class="${row.pin_status === 'set' ? 'yes' : 'pending'}">${esc(row.pin_status).toUpperCase()}</td>
      <td>${esc(row.last_login || '-')}</td><td class="choices">${choices(row.priorities)}</td>
      <td>${esc(assignment)}</td><td>${esc(row.picks_updated_at || '-')}</td>
      <td class="row-actions"><button class="small save-row">SAVE</button><button class="small reset-pin">RESET PIN</button><button class="small danger delete-account">DELETE ACCOUNT</button><button class="small danger delete-resident">DELETE RESIDENT</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="10" class="dim">No matching records.</td></tr>';
}
function adminKey() { return $('key').value.trim(); }
function accountKey(row) { return `${row.dataset.room}__${row.dataset.name}`.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); }
async function manage(payload) {
  const response = await fetch('/admin/manage', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({...payload, key:adminKey()}) });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}
function rowData(row) {
  const value = field => row.querySelector(`[data-field="${field}"]`);
  return { resident_id: row.dataset.id, name:value('name').value.trim(), room:value('room').value.trim(), payment_status:value('payment_status').value, using_machine:row.dataset.using === '1', source_note:row.dataset.note || '' };
}
async function refresh(message) { await loadRoster(); if (message) $('status').textContent = message; }
async function loadRoster() {
  const key = $('key').value.trim();
  if (!key) { $('status').textContent = 'admin key required'; $('status').className = 'status error'; return; }
  $('status').textContent = 'loading...'; $('status').className = 'status';
  try {
    const response = await fetch('/admin/roster', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key}) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    state.rows = data.residents || []; state.importedFrom = data.imported_from || '';
    $('status').textContent = `loaded ${state.rows.length} records`;
    render();
  } catch (error) { $('status').textContent = error.message; $('status').className = 'status error'; }
}
$('load').onclick = loadRoster;
$('preview').onclick = async () => {
  const key = adminKey();
  if (!key) { $('status').textContent = 'admin key required'; $('status').className = 'status error'; return; }
  $('status').textContent = 'building preview...'; $('status').className = 'status';
  try {
    const response = await fetch('/admin/preview', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key}) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    const people = Object.values(data.people || {});
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const slotsByDay = {};
    days.forEach(day => slotsByDay[day] = {});
    people.forEach(person => {
      const [day, slotIndex] = String(person.slot || '').split('-');
      if (!slotsByDay[day]) return;
      if (!slotsByDay[day][slotIndex]) slotsByDay[day][slotIndex] = [];
      slotsByDay[day][slotIndex].push(person);
    });
    const times = [
      ['00:00', '01:30'], ['01:30', '03:00'], ['03:00', '04:30'], ['04:30', '06:00'],
      ['06:00', '07:30'], ['07:30', '09:00'], ['09:00', '10:30'], ['10:30', '12:00'],
      ['12:00', '13:30'], ['13:30', '15:00'], ['15:00', '16:30'], ['16:30', '18:00'],
      ['18:00', '19:30'], ['19:30', '21:00'], ['21:00', '22:30'], ['22:30', '00:00']
    ];
    const assigned = people.length;
    const preferred = people.filter(person => person.priority_awarded).length;
    const tableRows = times.map((time, slotIndex) => {
      const cells = days.map(day => {
        const residents = (slotsByDay[day][slotIndex] || []).sort((a,b) => Number(a.machine) - Number(b.machine));
        const residentHtml = residents.map(person => `<div class="preview-machine"><span class="preview-person" title="Room ${esc(person.room)} - ${esc(person.name)}">${esc(person.room)} - ${esc(person.name)}</span><span class="priority-badge">${person.priority_awarded ? `P${esc(person.priority_awarded)}` : 'fallback'}</span></div>`).join('');
        return `<td class="${residents.length ? 'preview-occupied' : ''}">${residentHtml || '<span class="preview-blank"></span>'}</td>`;
      }).join('');
      return `<tr><td class="preview-time-col">${time[0]} - ${time[1]}</td>${cells}</tr>`;
    }).join('');
    const tableHtml = `<div class="preview-grid-wrap"><table class="preview-grid"><thead><tr><th class="preview-time-col">TIME (24/7)</th>${days.map(day => `<th>${day}</th>`).join('')}</tr></thead><tbody>${tableRows}</tbody></table></div>`;
    $('previewResult').hidden = false;
    $('previewResult').innerHTML = `<div class="preview-head"><div><div class="preview-title">Allotment Preview</div><div class="preview-subtitle">Preview only - database unchanged</div></div><div class="preview-stats"><span class="preview-stat">assigned ${assigned}/${data.total_people}</span><span class="preview-stat">preferred ${preferred}</span><span class="preview-stat">fallback ${assigned - preferred}</span><button id="exportPreviewPdf" class="small" style="margin-left:6px; border-color:var(--cyan); color:var(--cyan); background:#0c1114;">[ EXPORT PREVIEW (PDF) ]</button></div></div>${tableHtml}`;
    const prevPdfBtn = $('exportPreviewPdf');
    if (prevPdfBtn) {
      prevPdfBtn.onclick = () => {
        const key = adminKey();
        if (!key) return;
        window.open(`/admin/export.pdf?key=${encodeURIComponent(key)}&preview=1&view=all`, '_blank');
      };
    }
    $('status').textContent = 'preview ready; nothing published';
  } catch (error) { $('status').textContent = error.message; $('status').className = 'status error'; }
};
$('exportPdf').onclick = () => {
  const key = adminKey();
  if (!key) { $('status').textContent = 'admin key required'; $('status').className = 'status error'; return; }
  window.open(`/admin/export.pdf?key=${encodeURIComponent(key)}&view=all`, '_blank');
};
$('filter').oninput = render;
$('clear').onclick = () => { $('key').value = ''; $('filter').value = ''; state.rows = []; render(); $('status').textContent = 'cleared'; };
$('key').onkeydown = event => { if (event.key === 'Enter') loadRoster(); };
$('addForm').onsubmit = async event => {
  event.preventDefault();
  try { const form = new FormData(event.target); await manage({action:'add', name:form.get('name'), room:form.get('room'), payment_status:form.get('payment_status'), source_note:form.get('source_note'), using_machine:true}); event.target.reset(); await refresh('resident added'); }
  catch (error) { $('status').textContent = error.message; $('status').className = 'status error'; }
};
$('clearPreferences').onclick = async () => {
  if (!adminKey() || !confirm('Clear every resident preference and published allocation?')) return;
  try { await manage({action:'clear_preferences'}); await refresh('all preferences cleared'); }
  catch (error) { $('status').textContent = error.message; $('status').className = 'status error'; }
};
$('rows').onclick = async event => {
  const button = event.target.closest('button');
  if (!button) return;
  const row = button.closest('tr');
  try {
    if (button.classList.contains('save-row')) { await manage({action:'update', ...rowData(row)}); await refresh('resident updated'); }
    else if (button.classList.contains('reset-pin')) { const response = await fetch(`/admin/reset-pin?key=${encodeURIComponent(adminKey())}&room_name=${encodeURIComponent(accountKey(row))}`, {method:'POST'}); const data = await response.json(); if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`); await refresh('PIN reset'); }
    else if (button.classList.contains('delete-account') && confirm('Delete this resident login account?')) { await manage({action:'delete_account', resident_id:row.dataset.id}); await refresh('account deleted'); }
    else if (button.classList.contains('delete-resident') && confirm('Delete this resident, account, preferences, and assignment?')) { await manage({action:'delete_resident', resident_id:row.dataset.id}); await refresh('resident deleted'); }
  } catch (error) { $('status').textContent = error.message; $('status').className = 'status error'; }
};
const urlKey = new URLSearchParams(window.location.search).get('key');
if (urlKey) {
  $('key').value = urlKey;
  loadRoster();
}
</script>
</body>
</html>
